[workspace]
resolver = "2"
members = ["crates/engine", "crates/dax", "crates/m", "crates/model", "crates/publish", "crates/server", "crates/p2p", "crates/collab", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# dependencies (DuckDB above all) are built with some optimization: an unoptimized C++ DuckDB makes every executable that links it several hundred MB
opt-level = 1

[profile.test]
debug = "line-tables-only"
# a test run rebuilds its binaries anyway: the incremental cache of the workspace crates is only disk
incremental = false
