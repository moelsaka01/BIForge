name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          Get-Service | Where-Object { $_.Name -match 'SQL|MySQL|Maria|postgres|Oracle' } | Format-Table Name,Status,StartType
          Get-Command sqllocaldb,sqlcmd,mysqld,mysql,psql,docker -ErrorAction SilentlyContinue | Format-Table Name,Source
          sqllocaldb info
          Get-OdbcDriver | Select Name,Platform | Format-Table
          Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -ErrorAction SilentlyContinue | Select Name
          Get-ChildItem 'C:\Program Files\MySQL' -ErrorAction SilentlyContinue | Select Name
