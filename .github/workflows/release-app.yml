name: release-app
# Builds the Windows installers (NSIS setup program and WiX MSI, both with the optional server and command line), the signed
# update files for the in-app updater (latest.json), biforge-server.exe and biforge-cli.exe; signs the list of their SHA-256
# hashes with BIForge's release key; records a GitHub build attestation; writes release notes from docs/COVERAGE.md and the
# winget manifest; and attaches everything to a release. Start it by pushing a tag like v0.1.0 (nothing runs on ordinary pushes).
# Secrets (never committed): BIFORGE_RELEASE_SIGNING_KEY (release key), TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updater key). Optional code signing with SignPath: see docs/SIGNING.md.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend install
        working-directory: app
        run: npm ci
      - name: Server and command line (also the optional components of the installers)
        run: cargo build --release -p biforge-server -p biforge-cli
      - name: Stage the optional components
        shell: pwsh
        run: ./tools/stage-installer-tools.ps1 target/release
      - name: Installers and update files
        working-directory: app
        shell: pwsh
        env:
          BIFORGE_TOOLS_DIR: ${{ github.workspace }}\app\src-tauri\windows\tools
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis,msi --config src-tauri/tauri.updater.conf.json
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $b = "target/release/bundle"
          $setup = Get-ChildItem "$b/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem "$b/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $setup -or -not $msi) { throw "an installer was not built" }
          Copy-Item $setup.FullName, "$($setup.FullName).sig", $msi.FullName dist/
          Copy-Item target/release/biforge-server.exe, target/release/biforge-cli.exe dist/
          Copy-Item docs/media/demo.mp4 dist/
      # Code signing with SignPath Foundation: only when the project has been accepted and configured (docs/SIGNING.md).
      # Prepared, not yet exercised: it needs the owner's SignPath organization.
      - name: Upload unsigned files for SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: dist/*
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
      - name: Use the signed files and sign them again for the updater
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Copy-Item dist-signed/* dist/ -Force
          $setup = Get-ChildItem dist -Filter "*-setup.exe" | Select-Object -First 1
          Push-Location app
          npx tauri signer sign "$($setup.FullName)"
          Pop-Location
      - name: latest.json for the in-app updater
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "*-setup.exe" | Select-Object -First 1
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $sig = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($setup.Name)"
          $json = @{ version = $ver; notes = "See the release notes."; pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"); platforms = @{ "windows-x86_64" = @{ signature = $sig; url = $url } } } | ConvertTo-Json -Depth 5
          Set-Content -Path dist/latest.json -Value $json -Encoding utf8
      - name: Sign the list of hashes
        shell: pwsh
        env:
          BIFORGE_RELEASE_SIGNING_KEY: ${{ secrets.BIFORGE_RELEASE_SIGNING_KEY }}
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -notin @("latest.json") } | ForEach-Object { $_.FullName }
          ./target/release/biforge-cli.exe sign-release --key-env BIFORGE_RELEASE_SIGNING_KEY --out-dir dist @files
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
      - name: Check the signature against the public key in the repository
        shell: pwsh
        run: |
          ./target/release/biforge-cli.exe verify-release --public-key (Get-Content docs/release-public-key.txt -Raw).Trim() --dir dist
          if ($LASTEXITCODE -ne 0) { throw "the signature does not match docs/release-public-key.txt" }
      - name: Release notes and winget manifest
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          node tools/release-notes.mjs $ver docs/release-public-key.txt | Set-Content -Path notes.md -Encoding utf8
          node tools/winget-manifest.mjs $ver dist winget-manifest
          Compress-Archive -Path winget-manifest/* -DestinationPath dist/winget-manifest.zip
      - name: Keep the release notes with the files for the release job
        shell: pwsh
        run: Copy-Item notes.md dist/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
  # Installs the MSI the way a user would (the runner is an administrator), opens the sample project in the installed
  # app, then uninstalls. The release is only created when this passes.
  install-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend install (for the window driver only)
        working-directory: app
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dl
      - name: Install the MSI with the optional tools
        shell: pwsh
        run: |
          $msi = Get-ChildItem dl -Filter "*.msi" -Recurse | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$($msi.FullName)`"", "/qn", "ADDLOCAL=ALL", "/l*v", "install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "msiexec install failed: $($p.ExitCode)" }
          $dir = @((Join-Path $env:ProgramFiles "BIForge"), (Join-Path ${env:ProgramFiles(x86)} "BIForge")) | Where-Object { Test-Path (Join-Path $_ "biforge-app.exe") } | Select-Object -First 1
          if (-not $dir) { Get-Content install.log -Tail 60; throw "biforge-app.exe was not installed" }
          foreach ($f in "biforge-app.exe", "tools/biforge-server.exe", "tools/biforge-cli.exe") { if (-not (Test-Path (Join-Path $dir $f))) { throw "$f is missing from $dir" } }
          "BIFORGE_EXE=$(Join-Path $dir 'biforge-app.exe')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & (Join-Path $dir "tools/biforge-cli.exe") --version
      - name: Launch the installed app and open the sample project
        working-directory: app
        run: node e2e/install.mjs
      - name: Uninstall
        shell: pwsh
        run: |
          $msi = Get-ChildItem dl -Filter "*.msi" -Recurse | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList "/x", "`"$($msi.FullName)`"", "/qn", "/l*v", "uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 60; throw "msiexec uninstall failed: $($p.ExitCode)" }
          if (Test-Path $env:BIFORGE_EXE) { throw "the app is still installed after uninstall" }
  release:
    needs: [build, install-test]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: out
      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem out -File | Where-Object { $_.Name -ne "notes.md" } | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $files --repo "${{ github.repository }}" --title "BIForge ${{ github.ref_name }}" --notes-file out/notes.md
