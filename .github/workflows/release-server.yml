name: release-server
# Builds biforge-server.exe (method D: workspaces, invitations, data roles; no Docker) and attaches it to a GitHub release.
# Start it by pushing a tag like server-v0.1.0 (nothing runs on ordinary pushes).
on:
  push:
    tags: ["server-v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p biforge-server
      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" target/release/biforge-server.exe --title "BIForge server $env:GITHUB_REF_NAME" --notes "biforge-server.exe: run it on a computer that stays on (biforge-server --data <folder> --bind 0.0.0.0:7878 --public-url http://<address>:7878). It prints an admin token once. Plain HTTP: use a trusted network, a VPN or a tunnel."
