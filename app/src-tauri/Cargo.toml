[package]
name = "biforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
sha2 = "0.10"
biforge-collab = { path = "../../crates/collab" }
biforge-cli = { path = "../../crates/cli" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
open = "5"
biforge-model = { path = "../../crates/model" }
biforge-engine = { path = "../../crates/engine" }
biforge-dax = { path = "../../crates/dax" }
biforge-m = { path = "../../crates/m" }
biforge-publish = { path = "../../crates/publish" }
biforge-server = { path = "../../crates/server" }
biforge-p2p = { path = "../../crates/p2p" }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

