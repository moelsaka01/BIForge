[package]
name = "biforge-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
duckdb = { version = "1", features = ["bundled", "json", "parquet"] }
calamine = { version = "0.26", features = ["dates"] }
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
chrono = "0.4"
keyring = { version = "3", features = ["windows-native"] }
biforge-dax = { path = "../dax" }
biforge-m = { path = "../m" }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "chrono", "winauth"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
odbc-api = "29.2.0"
quick-xml = "0.42.0"
scraper = "0.27.0"
lopdf = "0.45.0"
mysql = "28.0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }

[dev-dependencies]
tempfile = "3"
biforge-model = { path = "../model" }
rust_xlsxwriter = "0.79"

[features]
# the development harnesses and the benchmark (examples) link DuckDB once more each: `cargo test` builds examples, so they only
# build with `--features tools` (cargo run -p biforge-engine --features tools --example report_harness)
tools = []

[[example]]
name = "perf_bench"
required-features = ["tools"]

[[example]]
name = "pq_harness"
required-features = ["tools"]

[[example]]
name = "report_harness"
required-features = ["tools"]
