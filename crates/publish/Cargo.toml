[package]
name = "biforge-publish"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
age = "0.11"

[dev-dependencies]
tempfile = "3"
