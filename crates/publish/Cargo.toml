[package]
name = "biforge-publish"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
age = "0.11"
crypto_box = { version = "0.9", features = ["seal", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3"
biforge-engine = { path = "../engine" }
