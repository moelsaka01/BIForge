[package]
name = "biforge-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BIForge peer to peer sharing (method C): pairing code, host approval, read-only and edit roles, expiry, revocation, live updates over iroh (encrypted QUIC)."

[lib]
path = "src/lib.rs"

[dependencies]
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
biforge-publish = { path = "../publish" }
biforge-collab = { path = "../collab" }

[dev-dependencies]
yrs = "0.25"
base64 = "0.22"
tempfile = "3"
