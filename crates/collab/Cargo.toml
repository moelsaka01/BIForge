[package]
name = "biforge-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared document state for real-time co-editing (a yrs relay): the server and the direct sessions merge and forward the Yjs updates the app produces. It never interprets the document."

[lib]
path = "src/lib.rs"

[dependencies]
yrs = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
